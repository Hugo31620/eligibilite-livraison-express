# Intégration continue : chaque push et chaque Pull Request doivent rester VERTS.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: eligibilite-livraison-express

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check --output-format=github .

  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # Vrai MongoDB pour les tests de contrat et l'entraînement de bout en bout (ADR-0008).
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      MONGO_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer l'application et les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Attendre que MongoDB réponde
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient
          client = MongoClient("mongodb://localhost:27017", serverSelectionTimeoutMS=2000)
          for attempt in range(30):
              try:
                  client.admin.command("ping")
                  print(f"MongoDB prêt après {attempt * 2} s")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("MongoDB injoignable après 60 s")
          PY
      - name: Lancer pytest
        run: pytest -q --junitxml=pytest-report.xml
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml

  audit:
    name: Audit des dépendances (pip-audit)
    runs-on: ubuntu-latest
    # Informatif : une CVE publiée dans une dépendance ne doit pas bloquer toutes les PR,
    # mais elle apparaît dans le résumé et se traite selon SECURITY.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pip-audit
      - run: pip-audit --skip-editable

  docker:
    name: Image Docker (test + prod)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Valider les fichiers docker compose (dev, test, prod)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.test.yml config -q
          docker compose -f docker-compose.prod.yml --env-file .env.prod.example config -q

      - name: Étape « test » — pytest et ruff dans l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Étape « prod » — image finale
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha

      - name: Vérifier l'image de prod (rootless, minimale, démarre)
        run: |
          set -eu
          user=$(docker image inspect --format '{{.Config.User}}' "$IMAGE:ci")
          echo "Utilisateur : $user"; [ "$user" = "10001:10001" ]
          ! docker run --rm --entrypoint python "$IMAGE:ci" -c "import pytest" 2>/dev/null \
            || { echo "pytest ne doit pas être dans l'image de prod"; exit 1; }
          ! docker run --rm --entrypoint sh "$IMAGE:ci" -c "command -v pip" \
            || { echo "pip ne doit pas être dans l'image de prod"; exit 1; }
          docker run -d --name api -p 8000:8000 "$IMAGE:ci"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs api; exit 1
      - name: Taille de l'image
        run: docker image ls "$IMAGE:ci" --format '{{.Repository}}:{{.Tag}} → {{.Size}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Scan de vulnérabilités (Trivy, informatif comme pip-audit)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 "$IMAGE:ci"
