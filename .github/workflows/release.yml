# Livraison : un tag vX.Y.Z (créé à la fin d'une branche release/* ou hotfix/*, cf. GitFlow)
# construit l'image, la teste, la publie sur ghcr.io et crée la Release GitHub.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write    # créer la Release GitHub
  packages: write    # publier sur ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Construire et publier l'image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du code
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          code=$(grep -m1 -E '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "Tag : $tag — pyproject.toml : $code"
          [ "$tag" = "$code" ] || { echo "::error::Le tag v$tag ne correspond pas à la version $code"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md n'a pas de section [$tag]"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      # Le GITHUB_TOKEN suffit pour publier dans le registre du propriétaire du dépôt.
      # Un Personal Access Token (secret GHCR_TOKEN) n'est utile que pour publier ailleurs.
      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Étape « test » — l'image n'est publiée que si les tests passent
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construire et publier l'image de prod
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Extraire les notes de version du CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[.*\]: / {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "### Image Docker"
            echo '```bash'
            echo "docker pull ${REGISTRY}/${GITHUB_REPOSITORY,,}:${version}"
            echo '```'
          } >> release-notes.md
          cat release-notes.md

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
