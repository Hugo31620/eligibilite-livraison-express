[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eligibilite-livraison-express"
version = "1.1.2"
description = "API de prédiction d'éligibilité à la livraison express (TP Industrialisation de l'IA - M2 YNOV)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pymongo>=4.10",   # source ERP et commandes collectées en test / prod (ADR-0008)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # requis par fastapi.testclient
    "pyyaml>=6.0",   # lecture du contrat openapi.yml dans les tests
    "ruff>=0.5",
    "mongomock>=4.3",   # MongoDB en mémoire pour les tests de contrat sans serveur
]

[project.scripts]
express-train = "eligibilite_livraison.cli:main"
express-apikey = "eligibilite_livraison.apikey_cli:main"
express-retrain = "eligibilite_livraison.retrain_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["error::DeprecationWarning:eligibilite_livraison.*"]

[tool.ruff]
line-length = 100
# erp/ : simulateur fourni par l'intervenant, conservé tel quel.
extend-exclude = ["erp"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "PT"]

[tool.ruff.lint.isort]
# Explicite : dans l'image Docker de test, src/ est absent (seule la roue est installée).
known-first-party = ["eligibilite_livraison", "tests"]
