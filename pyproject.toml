[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eligibilite-livraison-express"
version = "1.0.0"
description = "API de prédiction d'éligibilité à la livraison express (TP Industrialisation de l'IA - M2 YNOV)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # requis par fastapi.testclient
    "pyyaml>=6.0",   # lecture du contrat openapi.yml dans les tests
    "ruff>=0.5",
]

[project.scripts]
express-train = "eligibilite_livraison.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:eligibilite_livraison.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "PT"]
