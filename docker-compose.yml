# Environnement complet en local, identique à la cible cloud (ADR-0003, ADR-0006) :
#
#   Internet ──► :8080  proxy (nginx) ──► réseau interne ──► api:8000 (non publié)
#
# Usage :
#   docker compose --profile train run --rm trainer          # 1. entraîne le modèle
#   docker compose up -d --build                             # 2. lance proxy + API
#   curl http://localhost:8080/health

services:
  api:
    build: .
    image: eligibilite-livraison-express:1.0.0
    environment:
      APP_ENV: dev
      MODEL_VERSION: "1.0.0"
      EXPOSE_API_DOCS: "false"
    volumes:
      - artifacts:/app/artifacts:ro              # l'API ne peut pas modifier le modèle
      - orders:/app/data
      - ./secrets/api_keys.json:/run/secrets/api_keys.json:ro
    expose:
      - "8000"                                   # visible du proxy uniquement : AUCUN « ports: »
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on: [api]
    ports:
      - "8080:8080"                              # le SEUL port ouvert de la machine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  trainer:
    profiles: [train]
    image: eligibilite-livraison-express:1.0.0
    build: .
    command: ["express-train"]                   # écrit le modèle dans le volume, puis s'arrête
    environment:
      MODEL_VERSION: "1.0.0"
    volumes:
      - artifacts:/app/artifacts
    network_mode: none                           # l'entraînement n'a besoin d'aucun réseau

volumes:
  artifacts:
  orders:

networks:
  backend:
