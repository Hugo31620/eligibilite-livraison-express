# Reverse proxy : SEULE porte d'entrée de l'application (ADR-0006).
# - filtre les chemins : seuls /health, /health/ready et /v1/* atteignent l'API ;
# - limite le débit par adresse IP et la taille des requêtes ;
# - masque les versions logicielles et ajoute les en-têtes de sécurité.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # 10 requêtes/s par IP, rafale de 20 tolérée ; au-delà : 429.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;
    # 20 connexions simultanées maximum par IP.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    upstream api {
        server api:8000;
    }

    server {
        listen 8080;

        # Un lot de 1000 commandes pèse ~350 Ko : 1 Mo laisse de la marge, sans plus.
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        error_page 429 = @too_many_requests;
        error_page 413 = @too_large;

        location = /health {
            proxy_pass http://api;
        }

        location = /health/ready {
            proxy_pass http://api;
        }

        location /v1/ {
            limit_req zone=per_ip burst=20 nodelay;
            limit_conn conn_per_ip 20;
            limit_except GET POST { deny all; }

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Tout le reste (/docs, /openapi.json, fichiers, sondes de scan...) n'existe pas.
        location / {
            return 404 '{"error":"http_404","message":"Not Found"}';
        }

        location @too_many_requests {
            return 429 '{"error":"rate_limited","message":"Trop de requêtes, réessayez plus tard."}';
        }

        location @too_large {
            return 413 '{"error":"payload_too_large","message":"Requête trop volumineuse."}';
        }
    }
}
